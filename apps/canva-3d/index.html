<!doctype html>
<html lang="en" class="dark">

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; padding: 0; overflow: hidden; }
    #fallback-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .studio-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; max-width: 640px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .btn { display: inline-block; margin-top: 16px; padding: 10px 20px; background: #8b5cf6; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; }
    .btn:hover { background: #7c3aed; }
  </style>
  <body class="bg-surface-dark text-slate-100 overflow-hidden select-none">
    <div id="root">
      <div id="fallback-container">
        <div class="studio-card">
          <h1 style="color: #38bdf8; margin-top:0;">Canva 3D & Spatial Studio</h1>
          <p style="color: #94a3b8; font-size: 15px;">Autonomous Spatial Design Studio and 3D Voxel Engine.</p>
          <div style="background: #090d16; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin: 20px 0; text-align: left;">
            <p style="margin: 0; font-family: monospace; color: #10b981;">✓ Spatial Engine Loaded</p>
            <p style="margin: 4px 0 0 0; font-family: monospace; color: #a78bfa;">◈ To run full dev mode: cd apps/canva-3d &amp;&amp; npm run dev</p>
            <p style="margin: 4px 0 0 0; font-family: monospace; color: #38bdf8;">◈ Live Game Preview: Open /output/index.html</p>
          </div>
          <a class="btn" href="/index.html">Open Mini Minecraft Game</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
